[project]
name = "rename-scans"
version = "0.0.1"
description = "Rename scanned files"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alvaro", email = "alvarogarcia7@users.noreply.github.com" }
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "approvaltests>=14.7.1",
    "pre-commit>=3.8.0"
]

[tool.mypy]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_calls = true
exclude = [".venv"]
